services:
  - type: web
    name: special-ed-schedule
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_PASSWORD
        sync: false  # 在 Render Dashboard 手動設定（Secret）
      - key: GAS_WEBHOOK_URL
        sync: false  # 在 Render Dashboard 手動設定（覆蓋預設的 GAS URL）
